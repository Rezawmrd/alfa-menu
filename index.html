<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F4F0E8">
<title>ALFA | منوی دیجیتال</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#F4F0E8;
  --green:#343D32;
  --orange:#C66B42;
  --text:#222522;
  --muted:#85877F;
  --line:#DDDCD3;
  --white:#FFFEFA;
}

*{box-sizing:border-box}

html{
  scroll-behavior:smooth;
  scroll-padding-top:20px;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Vazirmatn,sans-serif;
  -webkit-tap-highlight-color:transparent;
}

button,input{font-family:inherit}
button{cursor:pointer}

.container{
  max-width:1100px;
  margin:auto;
  padding:0 22px;
}

/* HEADER */

header{
  padding:24px 0 12px;
}

.header-inner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.brand{
  font-family:"DM Sans",sans-serif;
  font-size:32px;
  font-weight:800;
  letter-spacing:-2px;
  color:var(--green);
  direction:ltr;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:9px;
}

.header-actions a{
  text-decoration:none;
  color:var(--green);
  border:1px solid var(--line);
  border-radius:30px;
  padding:8px 13px;
  font-size:11px;
  font-weight:600;
  transition:.2s;
}

.header-actions a:hover{
  background:var(--green);
  color:white;
  border-color:var(--green);
}

/* CATEGORY TITLE */

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:30px 0 23px;
}

.section-title-box{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 17px;
  border:1px solid rgba(52,61,50,.22);
  border-right:4px solid var(--orange);
  border-radius:5px;
  background:rgba(255,254,250,.65);
  box-shadow:0 5px 16px rgba(52,61,50,.04);
}

.title-mark{
  width:28px;
  height:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--green);
  color:var(--bg);
  border-radius:4px;
  font-family:"DM Sans",sans-serif;
  font-size:16px;
  font-weight:800;
  direction:ltr;
}

.section-head h2{
  margin:0;
  font-size:19px;
  font-weight:900;
  color:var(--green);
}

.title-line{
  width:35px;
  height:2px;
  background:var(--orange);
  border-radius:5px;
}

/* CATEGORIES */

.categories{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:13px;
}

.category{
  position:relative;
  height:175px;
  overflow:hidden;
  border-radius:7px;
  background:var(--green);
  cursor:pointer;
  isolation:isolate;
}

.category img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  transition:transform .5s;
  filter:brightness(.7);
}

.category:hover img{
  transform:scale(1.06);
}

.category:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(transparent 25%,rgba(0,0,0,.72));
  z-index:0;
}

.category-info{
  position:absolute;
  bottom:15px;
  right:14px;
  left:14px;
  color:white;
  z-index:1;
}

.category-info h3{
  font-size:16px;
  margin:0 0 3px;
  font-weight:800;
}

.category-info span{
  font-family:"DM Sans",sans-serif;
  font-size:9px;
  opacity:.8;
  letter-spacing:1px;
}

.category.active{
  outline:2px solid var(--orange);
  outline-offset:2px;
}

/* SEARCH */

.search-box{
  margin:27px 0;
}

.search-box input{
  width:100%;
  background:var(--white);
  border:1px solid var(--line);
  padding:15px 17px;
  outline:none;
  border-radius:6px;
  font-size:12px;
  color:var(--text);
}

.search-box input:focus{
  border-color:var(--orange);
}

/* PRODUCTS */

.menu-heading{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:32px 0 15px;
  gap:10px;
}

.menu-heading h2{
  font-size:23px;
  font-weight:900;
  margin:0;
}

.menu-heading span{
  font-family:"DM Sans",sans-serif;
  color:var(--orange);
  font-size:10px;
  font-weight:800;
  letter-spacing:1px;
  direction:ltr;
}

.menu-list{
  border-top:1px solid var(--green);
}

.menu-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  padding:20px 0;
  border-bottom:1px solid var(--line);
  animation:fadeUp .3s ease both;
}

.item-info{flex:1}

.item-info h3{
  font-size:14px;
  font-weight:800;
  margin:0 0 6px;
}

.item-info p{
  font-size:11px;
  color:var(--muted);
  line-height:1.9;
  margin:0;
}

.price{
  text-align:left;
  white-space:nowrap;
  color:var(--green);
  font-size:15px;
  font-weight:900;
}

.price small{
  display:block;
  color:var(--muted);
  font-size:9px;
  font-weight:400;
}

.empty{
  text-align:center;
  padding:45px 10px;
  color:var(--muted);
  font-size:12px;
}

/* ADDRESS AREA */

footer{
  margin-top:65px;
  padding:24px 0;
  border-top:1px solid var(--line);
}

.address-box{
  padding:17px;
  border:1px solid rgba(52,61,50,.2);
  border-radius:6px;
  background:rgba(255,254,250,.65);
  color:var(--muted);
  text-align:center;
  font-size:12px;
  line-height:2;
}

/* ANIMATION */

@keyframes fadeUp{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}

/* DESKTOP */

@media(min-width:700px){
  .container{padding:0 30px}
  header{padding-top:28px}
  .brand{font-size:36px}
  .categories{grid-template-columns:repeat(4,minmax(0,1fr))}
  .category{height:245px}
  .menu-item{padding:24px 0}
  .item-info h3{font-size:16px}
}
</style>
</head>

<body>

<header>
  <div class="container header-inner">
    <div class="brand">ALFA.</div>

    <nav class="header-actions">
      <a href="tel:PHONE_NUMBER">تماس</a>
      <a href="https://instagram.com/INSTAGRAM_ID"
         target="_blank"
         rel="noopener noreferrer">اینستاگرام</a>
    </nav>
  </div>
</header>

<main class="container">

  <section id="categoriesSection">

    <div class="section-head">
      <div class="section-title-box">
        <div class="title-mark">A</div>
        <h2>دسته‌بندی منو</h2>
      </div>
      <div class="title-line"></div>
    </div>

    <div class="categories" id="categories"></div>

  </section>

  <div class="search-box">
    <input
      type="search"
      id="search"
      placeholder="جستجو در منو..."
      autocomplete="off"
    >
  </div>

  <section id="menuSection">
    <div class="menu-heading">
      <h2 id="menuTitle">قهوه‌های گرم</h2>
      <span id="menuCount">00 ITEMS</span>
    </div>

    <div class="menu-list" id="menuList"></div>
  </section>

</main>

<footer>
  <div class="container">
    <div class="address-box">
      آدرس کافه در این قسمت قرار می‌گیرد.
    </div>
  </div>
</footer>

<script>
const categories = [
  {
    id:1,
    title:"قهوه‌های گرم",
    en:"HOT COFFEE",
    image:"https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=700"
  },
  {
    id:2,
    title:"نوشیدنی‌های سرد",
    en:"COLD DRINKS",
    image:"https://images.unsplash.com/photo-1536935338788846bb9981813?w=700"
  },
  {
    id:3,
    title:"کیک و دسر",
    en:"CAKES & DESSERTS",
    image:"https://images.unsplash.com/photo-1488477181946-6428a0291777?w=700"
  },
  {
    id:4,
    title:"غذا و میان‌وعده",
    en:"FOOD & SNACKS",
    image:"https://images.unsplash.com/photo-1547592180-85f173990554?w=700"
  }
];

const products = [
  {id:1,category:1,name:"اسپرسو سینگل",description:"یک شات اسپرسو با عطر و طعم غلیظ",price:65000},
  {id:2,category:1,name:"اسپرسو دبل",description:"دو شات اسپرسو برای دوستداران قهوه",price:85000},
  {id:3,category:1,name:"کاپوچینو",description:"اسپرسو، شیر گرم و فوم لطیف",price:115000},
  {id:4,category:1,name:"لاته",description:"اسپرسو با شیر بخار داده‌شده",price:125000},
  {id:5,category:2,name:"آیس لاته",description:"اسپرسو، شیر سرد و یخ",price:135000},
  {id:6,category:2,name:"آیس آمریکانو",description:"اسپرسو، آب سرد و یخ",price:95000},
  {id:7,category:3,name:"چیزکیک نیویورکی",description:"چیزکیک خامه‌ای با بافت لطیف",price:165000},
  {id:8,category:3,name:"کیک شکلاتی",description:"کیک شکلاتی با سس مخصوص",price:145000},
  {id:9,category:4,name:"ساندویچ مرغ",description:"مرغ گریل، سبزیجات و سس مخصوص",price:245000},
  {id:10,category:4,name:"سیب‌زمینی ویژه",description:"سیب‌زمینی سرخ‌شده با سس مخصوص",price:175000}
];

let activeCategory = 1;

const categoryContainer = document.getElementById("categories");
const menuList = document.getElementById("menuList");
const menuTitle = document.getElementById("menuTitle");
const menuCount = document.getElementById("menuCount");
const searchInput = document.getElementById("search");

function formatPrice(price){
  return new Intl.NumberFormat("fa-IR").format(price);
}

function renderCategories(){
  categoryContainer.innerHTML = categories.map(category => `
    <div
      class="category ${activeCategory === category.id ? "active" : ""}"
      onclick="selectCategory(${category.id})"
    >
      <img src="${category.image}" alt="${category.title}" loading="lazy">
      <div class="category-info">
        <h3>${category.title}</h3>
        <span>${category.en}</span>
      </div>
    </div>
  `).join("");
}

function selectCategory(id){
  activeCategory = id;
  searchInput.value = "";
  renderCategories();
  renderProducts();

  document.getElementById("menuSection").scrollIntoView({
    behavior:"smooth",
    block:"start"
  });
}

function renderProducts(){
  const search = searchInput.value.trim().toLowerCase();
  let filtered;

  if(search){
    filtered = products.filter(product =>
      product.name.toLowerCase().includes(search) ||
      product.description.toLowerCase().includes(search)
    );
    menuTitle.textContent = "نتایج جستجو";
  }else{
    filtered = products.filter(product =>
      product.category === activeCategory
    );
    const category = categories.find(c => c.id === activeCategory);
    menuTitle.textContent = category ? category.title : "منو";
  }

  menuCount.textContent =
    new Intl.NumberFormat("en-US").format(filtered.length) + " ITEMS";

  if(filtered.length === 0){
    menuList.innerHTML = `<div class="empty">محصولی پیدا نشد.</div>`;
    return;
  }

  menuList.innerHTML = filtered.map(product => `
    <div class="menu-item">
      <div class="item-info">
        <h3>${product.name}</h3>
        <p>${product.description}</p>
      </div>
      <div class="price">
        ${formatPrice(product.price)}
        <small>تومان</small>
      </div>
    </div>
  `).join("");
}

searchInput.addEventListener("input",renderProducts);

renderCategories();
renderProducts();
</script>

</body>
</html>
