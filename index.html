<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F4F0E8">
<title>ALFA | منوی کافه</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --cream:#F4F0E8;
  --green:#343D32;
  --orange:#C66B42;
  --text:#292B26;
  --muted:#77776E;
  --line:#DDD8CC;
  --white:#FFFEFA;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
  scroll-padding-top:90px;
}

body{
  background:var(--cream);
  color:var(--text);
  font-family:"Vazirmatn",sans-serif;
  line-height:1.8;
  overflow-x:hidden;
}

a{
  color:inherit;
  text-decoration:none;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.container{
  width:min(1100px,calc(100% - 36px));
  margin:auto;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(244,240,232,.94);
  backdrop-filter:blur(15px);
  border-bottom:1px solid rgba(52,61,50,.12);
}

.header-inner{
  height:75px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  direction:ltr;
  font-family:"DM Sans",sans-serif;
  font-size:31px;
  font-weight:800;
  letter-spacing:-2px;
  color:var(--green);
}

.brand span{
  color:var(--orange);
}

.header-actions{
  display:flex;
  align-items:center;
  gap:9px;
}

.header-actions a{
  font-size:12px;
  font-weight:600;
  padding:8px 15px;
  border:1px solid var(--line);
  border-radius:3px;
  transition:.25s;
}

.header-actions a:hover{
  background:var(--green);
  color:var(--white);
  border-color:var(--green);
}

/* MAIN */

main{
  padding-bottom:35px;
}

/* SEARCH */

.search-wrap{
  margin-top:27px;
}

.search{
  display:flex;
  align-items:center;
  gap:12px;
  background:var(--white);
  border:1px solid var(--line);
  padding:0 17px;
  height:52px;
  transition:.25s;
}

.search:focus-within{
  border-color:var(--green);
  box-shadow:0 5px 20px rgba(52,61,50,.06);
}

.search svg{
  width:19px;
  height:19px;
  stroke:var(--muted);
  fill:none;
  stroke-width:1.7;
  flex-shrink:0;
}

.search input{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  font-size:13px;
  color:var(--text);
}

.search input::placeholder{
  color:#99958B;
}

/* CATEGORY TITLE */

.section-head{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:16px;
  margin:36px 0 25px;
}

.section-head h2{
  position:relative;
  margin:0;
  padding:0 0 10px;
  font-size:21px;
  font-weight:900;
  color:var(--green);
}

.section-head h2::after{
  content:"";
  position:absolute;
  width:25px;
  height:3px;
  background:var(--orange);
  border-radius:10px;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
}

.heading-line{
  width:38px;
  height:1px;
  background:var(--line);
}

/* CATEGORIES */

.category-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:17px;
}

.category-card{
  position:relative;
  display:block;
  width:100%;
  text-align:right;
  border:0;
  padding:0;
  background:var(--green);
  overflow:hidden;
  aspect-ratio:1/1.05;
  min-height:190px;
  color:white;
  isolation:isolate;
}

.category-card img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-2;
  transition:transform .6s;
}

.category-card::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    180deg,
    rgba(18,24,18,.03) 15%,
    rgba(18,24,18,.25) 42%,
    rgba(18,24,18,.88) 100%
  );
  z-index:-1;
}

.category-card:hover img{
  transform:scale(1.06);
}

.cat-info{
  position:absolute;
  right:18px;
  left:18px;
  bottom:17px;
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:8px;
}

.cat-name{
  font-size:17px;
  font-weight:800;
  line-height:1.5;
}

.cat-caption{
  margin-top:4px;
  color:rgba(255,255,255,.72);
  font-size:10px;
}

.cat-arrow{
  width:33px;
  height:33px;
  flex-shrink:0;
  display:grid;
  place-items:center;
  border:1px solid rgba(255,255,255,.55);
  border-radius:50%;
  font-size:20px;
  transition:.25s;
}

.category-card:hover .cat-arrow{
  color:var(--green);
  background:white;
  border-color:white;
}

/* MENU */

.menu-area{
  margin-top:48px;
  scroll-margin-top:95px;
}

.menu-heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  border-bottom:1px solid var(--line);
  padding-bottom:14px;
  margin-bottom:17px;
}

.menu-heading h2{
  font-size:21px;
  font-weight:900;
  color:var(--green);
}

.menu-heading p{
  font-size:11px;
  color:var(--muted);
}

.menu-toolbar{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:2px 0 15px;
  scrollbar-width:none;
}

.menu-toolbar::-webkit-scrollbar{
  display:none;
}

.menu-chip{
  flex-shrink:0;
  padding:8px 16px;
  border:1px solid var(--line);
  background:transparent;
  color:var(--text);
  font-size:12px;
  border-radius:2px;
  transition:.2s;
}

.menu-chip.active,
.menu-chip:hover{
  color:white;
  background:var(--green);
  border-color:var(--green);
}

.menu-section{
  display:none;
  animation:fadeIn .3s ease;
}

.menu-section.active{
  display:block;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1;transform:translateY(0)}
}

/* SUBCATEGORIES */

.sub-tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:0 0 14px;
  scrollbar-width:none;
}

.sub-tabs::-webkit-scrollbar{
  display:none;
}

.sub-tab{
  flex-shrink:0;
  border:1px solid var(--line);
  background:rgba(255,254,250,.5);
  padding:6px 13px;
  font-size:11px;
  color:var(--muted);
  border-radius:2px;
}

.sub-tab.active{
  background:#E5DED0;
  color:var(--green);
  border-color:#C7BEAD;
  font-weight:700;
}

.sub-section{
  display:none;
}

.sub-section.active{
  display:block;
}

/* PRODUCT LIST */

.item-list{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:0 25px;
}

.item-card{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:center;
  gap:6px 12px;
  padding:18px 0;
  border-bottom:1px solid var(--line);
  animation:fadeIn .3s ease both;
}

.item-name{
  font-size:14px;
  font-weight:700;
  color:var(--text);
}

.item-desc{
  font-size:11px;
  color:var(--muted);
  margin-top:3px;
  line-height:1.9;
}

.item-price{
  direction:rtl;
  white-space:nowrap;
  font-family:"Vazirmatn",sans-serif;
  font-size:13px;
  font-weight:800;
  color:var(--green);
}

.empty{
  text-align:center;
  padding:30px 12px;
  color:var(--muted);
  font-size:13px;
  background:rgba(255,254,250,.45);
  border:1px dashed var(--line);
}

/* ADDRESS FOOTER */

.footer{
  margin-top:65px;
  background:var(--green);
  color:var(--white);
  position:relative;
  overflow:hidden;
}

.footer::before{
  content:"A";
  position:absolute;
  direction:ltr;
  left:-12px;
  bottom:-105px;
  font-family:"DM Sans",sans-serif;
  font-size:300px;
  font-weight:800;
  line-height:1;
  color:rgba(255,255,255,.035);
  pointer-events:none;
}

.footer-inner{
  position:relative;
  z-index:1;
  width:min(1100px,calc(100% - 36px));
  margin:auto;
  padding:37px 0 25px;
}

.footer-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:25px;
  padding-bottom:28px;
  border-bottom:1px solid rgba(255,255,255,.16);
}

.footer-brand{
  direction:ltr;
  font-family:"DM Sans",sans-serif;
  font-size:36px;
  font-weight:800;
  letter-spacing:-2px;
  line-height:1.2;
}

.footer-brand span{
  color:#E3A17F;
}

.footer-tagline{
  margin-top:8px;
  font-size:11px;
  color:rgba(255,255,255,.64);
}

.footer-label{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:12px;
  font-weight:700;
  margin-bottom:12px;
}

.footer-label::before{
  content:"";
  width:21px;
  height:2px;
  background:var(--orange);
}

.address-box{
  margin-top:23px;
  padding:19px 20px;
  border:1px solid rgba(255,255,255,.19);
  background:rgba(255,255,255,.045);
  display:flex;
  align-items:center;
  gap:15px;
  transition:.25s;
}

.address-box:hover{
  background:rgba(255,255,255,.075);
  border-color:rgba(255,255,255,.32);
}

.address-icon{
  flex-shrink:0;
  width:43px;
  height:43px;
  display:grid;
  place-items:center;
  border:1px solid rgba(255,255,255,.22);
  color:#E3A17F;
}

.address-icon svg{
  width:21px;
  height:21px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.5;
}

.address-content{
  min-width:0;
}

.address-title{
  font-size:12px;
  font-weight:800;
  margin-bottom:3px;
}

.address-text{
  color:rgba(255,255,255,.67);
  font-size:11px;
  line-height:2;
  overflow-wrap:anywhere;
}

.address-note{
  display:inline-block;
  margin-top:7px;
  padding:3px 9px;
  color:#E3A17F;
  border:1px solid rgba(227,161,127,.35);
  font-size:9px;
}

.footer-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding-top:19px;
  color:rgba(255,255,255,.48);
  font-family:"Vazirmatn",sans-serif;
  font-size:10px;
}

.footer-bottom .made{
  direction:ltr;
  font-family:"DM Sans",sans-serif;
  letter-spacing:1px;
}

/* TOAST */

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translate(-50%,15px);
  padding:10px 18px;
  background:var(--green);
  color:white;
  font-size:12px;
  opacity:0;
  visibility:hidden;
  transition:.25s;
  z-index:200;
}

.toast.show{
  opacity:1;
  visibility:visible;
  transform:translate(-50%,0);
}

/* RESPONSIVE */

@media(min-width:900px){
  .category-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }

  .category-card{
    aspect-ratio:1.28/1;
  }
}

@media(max-width:600px){
  .container{
    width:calc(100% - 28px);
  }

  .header-inner{
    height:67px;
  }

  .brand{
    font-size:28px;
  }

  .header-actions{
    gap:6px;
  }

  .header-actions a{
    padding:7px 10px;
    font-size:11px;
  }

  .search-wrap{
    margin-top:21px;
  }

  .section-head{
    margin:30px 0 20px;
    gap:12px;
  }

  .section-head h2{
    font-size:19px;
  }

  .heading-line{
    width:27px;
  }

  .category-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:11px;
  }

  .category-card{
    aspect-ratio:1/1.12;
    min-height:155px;
  }

  .cat-info{
    right:12px;
    left:12px;
    bottom:12px;
  }

  .cat-name{
    font-size:14px;
  }

  .cat-caption{
    font-size:9px;
  }

  .cat-arrow{
    width:29px;
    height:29px;
    font-size:17px;
  }

  .menu-area{
    margin-top:38px;
  }

  .menu-heading h2{
    font-size:18px;
  }

  .item-list{
    grid-template-columns:1fr;
  }

  .item-card{
    padding:16px 0;
  }

  .item-name{
    font-size:13px;
  }

  .item-price{
    font-size:12px;
  }

  .footer{
    margin-top:45px;
  }

  .footer-inner{
    width:calc(100% - 28px);
    padding-top:29px;
  }

  .footer-top{
    padding-bottom:22px;
  }

  .footer-brand{
    font-size:31px;
  }

  .footer-tagline{
    font-size:10px;
  }

  .address-box{
    padding:15px 13px;
    gap:11px;
  }

  .address-icon{
    width:38px;
    height:38px;
  }

  .address-text{
    font-size:10px;
  }

  .footer-bottom{
    align-items:flex-start;
    flex-direction:column;
    gap:5px;
  }
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    scroll-behavior:auto!important;
    animation:none!important;
    transition:none!important;
  }
}
</style>
</head>

<script>

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[char]));
}

function formatPrice(price){
  const value = Number(price) || 0;
  if(value <= 0) return "قیمت اعلام نشده";
  return value.toLocaleString("fa-IR") + " تومان";
}

function renderCategories(){
  categoryGrid.innerHTML = "";

  menuData.forEach(category => {
    const card = document.createElement("button");
    card.type = "button";
    card.className = "category-card";

    card.innerHTML = `
      <img
        src="${escapeHTML(category.image)}"
        alt="${escapeHTML(category.name)}"
        loading="lazy"
      >
      <div class="cat-info">
        <div>
          <div class="cat-name">${escapeHTML(category.name)}</div>
          <div class="cat-caption">${escapeHTML(category.caption)}</div>
        </div>
        <span class="cat-arrow" aria-hidden="true">↙</span>
      </div>
    `;

    card.addEventListener("click", () => selectCategory(category.id));
    categoryGrid.appendChild(card);
  });
}

function renderToolbar(){
  menuToolbar.innerHTML = "";

  menuData.forEach(category => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "menu-chip";
    button.dataset.category = category.id;
    button.textContent = category.name;
    button.addEventListener("click", () => selectCategory(category.id));

    menuToolbar.appendChild(button);
  });
}

function renderMenu(){
  dynamicMenu.innerHTML = "";

  menuData.forEach(category => {
    const section = document.createElement("section");
    section.className = "menu-section";
    section.id = "menu-" + category.id;
    section.dataset.category = category.id;

    const list = document.createElement("div");
    list.className = "item-list";

    category.products.forEach(product => {
      const item = document.createElement("article");
      item.className = "item-card";
      item.dataset.search = (
        category.name + " " +
        product.name + " " +
        (product.description || "")
      ).toLocaleLowerCase("fa");

      item.innerHTML = `
        <div>
          <div class="item-name">${escapeHTML(product.name)}</div>
          ${product.description
            ? `<div class="item-desc">${escapeHTML(product.description)}</div>`
            : ""}
        </div>
        <div class="item-price">${formatPrice(product.price)}</div>
      `;

      list.appendChild(item);
    });

    if(!category.products.length){
      list.innerHTML = '<div class="empty">هنوز محصولی ثبت نشده است.</div>';
    }

    section.appendChild(list);
    dynamicMenu.appendChild(section);
  });

  updateActiveCategory();
  updateSearch();
}

function selectCategory(id){
  activeCategory = id;
  updateActiveCategory();

  document.getElementById("menuArea").scrollIntoView({
    behavior:"smooth",
    block:"start"
  });

  updateSearch();
}

function updateActiveCategory(){
  document.querySelectorAll(".menu-chip").forEach(button => {
    button.classList.toggle(
      "active",
      button.dataset.category === activeCategory
    );
  });

  document.querySelectorAll(".menu-section").forEach(section => {
    section.classList.toggle(
      "active",
      section.dataset.category === activeCategory
    );
  });
}

function updateSearch(){
  const query = searchInput.value.trim().toLocaleLowerCase("fa");
  let visibleCount = 0;

  document.querySelectorAll(".menu-section").forEach(section => {
    const isActive = section.dataset.category === activeCategory;
    const cards = section.querySelectorAll(".item-card");

    cards.forEach(card => {
      const matches = !query || card.dataset.search.includes(query);
      const visible = query ? matches : isActive;

      card.style.display = visible ? "grid" : "none";

      if(visible) visibleCount++;
    });

    section.classList.toggle("active", query ? true : isActive);
  });

  document.querySelectorAll(".menu-chip").forEach(button => {
    button.classList.toggle(
      "active",
      !query && button.dataset.category === activeCategory
    );
  });

  if(query){
    resultNote.textContent = visibleCount
      ? visibleCount.toLocaleString("fa-IR") + " مورد پیدا شد"
      : "موردی پیدا نشد";
  }else{
    resultNote.textContent = "انتخاب مورد علاقه‌تان";
  }
}

searchInput.addEventListener("input", updateSearch);

renderCategories();
renderToolbar();
renderMenu();

if(menuData.length){
  selectCategory(menuData[0].id);
}
</script>

</body>
</html>
