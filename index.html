<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F4F0E8">
<title>ALFA | منوی کافه</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --cream:#F4F0E8;
  --green:#343D32;
  --orange:#C66B42;
  --text:#292B26;
  --muted:#77776E;
  --line:#DDD8CC;
  --white:#FFFEFA;
}

*{box-sizing:border-box;margin:0;padding:0}

html{scroll-behavior:smooth}

body{
  background:var(--cream);
  color:var(--text);
  font-family:"Vazirmatn",sans-serif;
  line-height:1.8;
  overflow-x:hidden;
}

a{color:inherit;text-decoration:none}
button,input{font:inherit}
button{cursor:pointer}

.container{
  width:min(1100px,calc(100% - 36px));
  margin:auto;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(244,240,232,.94);
  backdrop-filter:blur(15px);
  border-bottom:1px solid rgba(52,61,50,.12);
}

.header-inner{
  height:75px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  direction:ltr;
  font-family:"DM Sans",sans-serif;
  font-size:31px;
  font-weight:800;
  letter-spacing:-2px;
  color:var(--green);
}

.brand span{color:var(--orange)}

.header-actions{
  display:flex;
  align-items:center;
  gap:9px;
}

.header-actions a{
  font-size:12px;
  font-weight:600;
  padding:8px 15px;
  border:1px solid var(--line);
  border-radius:3px;
  transition:.25s;
}

.header-actions a:hover{
  background:var(--green);
  color:var(--white);
  border-color:var(--green);
}

/* MAIN */

main{padding-bottom:35px}

/* SEARCH */

.search-wrap{margin-top:27px}

.search{
  display:flex;
  align-items:center;
  gap:12px;
  background:var(--white);
  border:1px solid var(--line);
  padding:0 17px;
  height:52px;
  transition:.25s;
}

.search:focus-within{
  border-color:var(--green);
  box-shadow:0 5px 20px rgba(52,61,50,.06);
}

.search svg{
  width:19px;
  height:19px;
  stroke:var(--muted);
  fill:none;
  stroke-width:1.7;
  flex-shrink:0;
}

.search input{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  font-size:13px;
  color:var(--text);
}

.search input::placeholder{color:#99958B}

/* CATEGORY TITLE */

.section-head{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:16px;
  margin:36px 0 25px;
}

.section-head h2{
  position:relative;
  margin:0;
  padding:0 0 10px;
  font-size:21px;
  font-weight:900;
  color:var(--green);
}

.section-head h2::after{
  content:"";
  position:absolute;
  width:25px;
  height:3px;
  background:var(--orange);
  border-radius:10px;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
}

.heading-line{
  width:38px;
  height:1px;
  background:var(--line);
}

/* CATEGORY GRID */

.category-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:17px;
}

.category-card{
  position:relative;
  display:block;
  width:100%;
  text-align:right;
  border:0;
  padding:0;
  background:var(--green);
  overflow:hidden;
  aspect-ratio:1/1.05;
  min-height:190px;
  color:white;
  isolation:isolate;
}

.category-card img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-2;
  transition:transform .6s;
}

.category-card::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    180deg,
    rgba(18,24,18,.03) 15%,
    rgba(18,24,18,.25) 42%,
    rgba(18,24,18,.88) 100%
  );
  z-index:-1;
}

.category-card:hover img{transform:scale(1.06)}

.cat-info{
  position:absolute;
  right:18px;
  left:18px;
  bottom:17px;
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:8px;
}

.cat-name{
  font-size:17px;
  font-weight:800;
  line-height:1.5;
}

.cat-caption{
  margin-top:4px;
  color:rgba(255,255,255,.72);
  font-size:10px;
}

.cat-arrow{
  width:33px;
  height:33px;
  flex-shrink:0;
  display:grid;
  place-items:center;
  border:1px solid rgba(255,255,255,.55);
  border-radius:50%;
  font-size:20px;
  transition:.25s;
}

.category-card:hover .cat-arrow{
  color:var(--green);
  background:white;
  border-color:white;
}

/* PAGE TRANSITIONS */

.view{
  display:none;
  animation:pageEnter .28s ease;
}

.view.active{display:block}

@keyframes pageEnter{
  from{opacity:0;transform:translateY(7px)}
  to{opacity:1;transform:translateY(0)}
}

.back-button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  padding:9px 15px;
  margin:25px 0 23px;
  color:var(--green);
  background:transparent;
  border:1px solid var(--line);
  font-size:12px;
  font-weight:700;
  transition:.2s;
}

.back-button:hover{
  color:white;
  background:var(--green);
  border-color:var(--green);
}

.back-arrow{font-size:17px}

.page-title{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:15px;
  border-bottom:1px solid var(--line);
  padding-bottom:18px;
  margin-bottom:17px;
}

.page-title h2{
  font-size:25px;
  font-weight:900;
  color:var(--green);
  line-height:1.5;
}

.page-title p{
  font-size:11px;
  color:var(--muted);
  margin-top:3px;
}

.page-number{
  direction:ltr;
  font-family:"DM Sans",sans-serif;
  font-size:30px;
  font-weight:800;
  color:rgba(52,61,50,.17);
  line-height:1;
}

/* MENU */

.menu-toolbar{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:2px 0 15px;
  scrollbar-width:none;
}

.menu-toolbar::-webkit-scrollbar{display:none}

.menu-chip{
  flex-shrink:0;
  padding:8px 16px;
  border:1px solid var(--line);
  background:transparent;
  color:var(--text);
  font-size:12px;
  border-radius:2px;
  transition:.2s;
}

.menu-chip.active,
.menu-chip:hover{
  color:white;
  background:var(--green);
  border-color:var(--green);
}

.menu-section{display:none}
.menu-section.active{display:block}

/* SUBCATEGORIES */

.sub-tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:0 0 14px;
  scrollbar-width:none;
}

.sub-tabs::-webkit-scrollbar{display:none}

.sub-tab{
  flex-shrink:0;
  border:1px solid var(--line);
  background:rgba(255,254,250,.5);
  padding:6px 13px;
  font-size:11px;
  color:var(--muted);
  border-radius:2px;
}

.sub-tab.active{
  background:#E5DED0;
  color:var(--green);
  border-color:#C7BEAD;
  font-weight:700;
}

.sub-section{display:none}
.sub-section.active{display:block}

/* PRODUCT LIST */

.item-list{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:0 25px;
}

.item-card{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:center;
  gap:6px 12px;
  padding:18px 0;
  border-bottom:1px solid var(--line);
  animation:pageEnter .3s ease both;
}

.item-name{
  font-size:14px;
  font-weight:700;
  color:var(--text);
}

.item-desc{
  font-size:11px;
  color:var(--muted);
  margin-top:3px;
  line-height:1.9;
}

.item-price{
  direction:rtl;
  white-space:nowrap;
  font-family:"Vazirmatn",sans-serif;
  font-size:13px;
  font-weight:800;
  color:var(--green);
}

.empty{
  text-align:center;
  padding:30px 12px;
  color:var(--muted);
  font-size:13px;
  background:rgba(255,254,250,.45);
  border:1px dashed var(--line);
}

/* ADDRESS ONLY FOOTER */

.footer{
  margin-top:45px;
  padding:0 0 25px;
  background:var(--cream);
}

.footer-inner{
  width:min(1100px,calc(100% - 36px));
  margin:auto;
}

.address-box{
  padding:20px;
  border:1px solid rgba(52,61,50,.19);
  background:var(--green);
  color:var(--white);
  display:flex;
  align-items:center;
  gap:15px;
  position:relative;
  overflow:hidden;
}

.address-box::after{
  content:"";
  position:absolute;
  left:-35px;
  bottom:-55px;
  width:130px;
  height:130px;
  border:1px solid rgba(255,255,255,.09);
  border-radius:50%;
  pointer-events:none;
}

.address-icon{
  flex-shrink:0;
  width:45px;
  height:45px;
  display:grid;
  place-items:center;
  border:1px solid rgba(255,255,255,.25);
  color:#E3A17F;
}

.address-icon svg{
  width:22px;
  height:22px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.5;
}

.address-content{min-width:0;position:relative;z-index:1}

.address-title{
  font-size:13px;
  font-weight:800;
  margin-bottom:3px;
}

.address-text{
  color:rgba(255,255,255,.72);
  font-size:11px;
  line-height:2;
  overflow-wrap:anywhere;
}

.address-note{
  display:inline-block;
  margin-top:7px;
  padding:3px 9px;
  color:#E3A17F;
  border:1px solid rgba(227,161,127,.35);
  font-size:9px;
}

/* TOAST */

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translate(-50%,15px);
  padding:10px 18px;
  background:var(--green);
  color:white;
  font-size:12px;
  opacity:0;
  visibility:hidden;
  transition:.25s;
  z-index:200;
}

.toast.show{
  opacity:1;
  visibility:visible;
  transform:translate(-50%,0);
}

/* RESPONSIVE */

@media(min-width:900px){
  .category-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .category-card{aspect-ratio:1.28/1}
}

@media(max-width:600px){
  .container{width:calc(100% - 28px)}
  .header-inner{height:67px}
  .brand{font-size:28px}
  .header-actions{gap:6px}
  .header-actions a{padding:7px 10px;font-size:11px}
  .search-wrap{margin-top:21px}
  .section-head{margin:30px 0 20px;gap:12px}
  .section-head h2{font-size:19px}
  .heading-line{width:27px}
  .category-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
  .category-card{aspect-ratio:1/1.12;min-height:155px}
  .cat-info{right:12px;left:12px;bottom:12px}
  .cat-name{font-size:14px}
  .cat-caption{font-size:9px}
  .cat-arrow{width:29px;height:29px;font-size:17px}
  .back-button{margin:20px 0}
  .page-title h2{font-size:21px}
  .page-number{font-size:25px}
  .item-list{grid-template-columns:1fr}
  .item-card{padding:16px 0}
  .item-name{font-size:13px}
  .item-price{font-size:12px}
  .footer{margin-top:35px;padding-bottom:18px}
  .footer-inner{width:calc(100% - 28px)}
  .address-box{padding:15px 13px;gap:11px}
  .address-icon{width:38px;height:38px}
  .address-text{font-size:10px}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    scroll-behavior:auto!important;
    animation:none!important;
    transition:none!important;
  }
}
</style>
</head>

<body>

<header>
  <div class="container header-inner">
    <a class="brand" href="#" id="brandHome" aria-label="ALFA">ALFA<span>.</span></a>

    <nav class="header-actions">
      <a href="tel:PHONE_NUMBER">تماس</a>
      <a href="https://instagram.com/INSTAGRAM_ID" target="_blank" rel="noopener noreferrer">اینستاگرام</a>
    </nav>
  </div>
</header>

<main class="container">

  <div class="search-wrap">
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="7.5"></circle>
        <path d="m16.5 16.5 5 5"></path>
      </svg>
      <input id="searchInput" type="search" placeholder="جستجو در منو..." autocomplete="off">
    </label>
  </div>

  <!-- HOME / CATEGORIES PAGE -->
  <section id="homeView" class="view active">
    <div class="section-head">
      <span class="heading-line"></span>
      <h2>دسته‌بندی‌ها</h2>
      <span class="heading-line"></span>
    </div>

    <div class="category-grid" id="categoryGrid"></div>
  </section>

  <!-- CATEGORY DETAIL PAGE -->
  <section id="categoryView" class="view">
    <button class="back-button" id="backButton" type="button">
      <span class="back-arrow">→</span>
      بازگشت به دسته‌بندی‌ها
    </button>

    <div class="page-title">
      <div>
        <h2 id="pageCategoryName">منوی کافه</h2>
        <p id="pageCategoryCaption">انتخاب مورد علاقه‌تان</p>
      </div>
      <div class="page-number" id="pageCategoryNumber">01</div>
    </div>

    <div id="dynamicMenu"></div>
  </section>

  <!-- SEARCH RESULTS PAGE -->
  <section id="searchView" class="view">
    <button class="back-button" id="searchBackButton" type="button">
      <span class="back-arrow">→</span>
      بازگشت به دسته‌بندی‌ها
    </button>

    <div class="page-title">
      <div>
        <h2>نتایج جستجو</h2>
        <p id="resultNote">محصولات منو</p>
      </div>
    </div>

    <div id="searchResults" class="item-list"></div>
  </section>

</main>

<footer class="footer">
  <div class="footer-inner">
    <div class="address-box">
      <div class="address-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"></path>
          <circle cx="12" cy="10" r="2.5"></circle>
        </svg>
      </div>

      <div class="address-content">
        <div class="address-title">آدرس کافه</div>
        <div class="address-text" id="cafeAddress">آدرس کافه را اینجا وارد کنید.</div>
        <span class="address-note">منتظر دیدارتان هستیم</span>
      </div>
    </div>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script>
const CAFE_ADDRESS = "آدرس دقیق کافه را اینجا بنویسید";

const menuData = [
  {
    id:"coffee",
    name:"قهوه گرم",
    caption:"COFFEE",
    image:"https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=800&q=85",
    products:[
      {name:"اسپرسو",description:"قهوه خالص و غلیظ",price:0},
      {name:"آمریکانو",description:"اسپرسو با آب داغ",price:0},
      {name:"کاپوچینو",description:"اسپرسو، شیر و فوم شیر",price:0},
      {name:"لاته",description:"اسپرسو و شیر بخار داده‌شده",price:0},
      {name:"موکا",description:"ترکیب قهوه و شکلات",price:0},
      {name:"کارامل ماکیاتو",description:"قهوه، شیر و کارامل",price:0}
    ]
  },
  {
    id:"cold",
    name:"نوشیدنی سرد",
    caption:"COLD DRINKS",
    image:"https://images.unsplash.com/photo-1517701604599-bb29b565090c?auto=format&fit=crop&w=800&q=85",
    products:[
      {name:"آیس آمریکانو",description:"اسپرسو و آب سرد",price:0},
      {name:"آیس لاته",description:"اسپرسو و شیر سرد",price:0},
      {name:"آیس موکا",description:"قهوه، شکلات و شیر",price:0},
      {name:"لیموناد",description:"نوشیدنی خنک لیمویی",price:0}
    ]
  },
  {
    id:"cake",
    name:"کیک و دسر",
    caption:"CAKE & DESSERT",
    image:"https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=800&q=85",
    products:[
      {name:"چیزکیک",description:"",price:0},
      {name:"کیک شکلاتی",description:"",price:0},
      {name:"تیرامیسو",description:"",price:0},
      {name:"براونی",description:"",price:0}
    ]
  },
  {
    id:"breakfast",
    name:"صبحانه",
    caption:"BREAKFAST",
    image:"https://images.unsplash.com/photo-1533089860892-a7c6f0a88666?auto=format&fit=crop&w=800&q=85",
    products:[
      {name:"صبحانه انگلیسی",description:"",price:0},
      {name:"املت",description:"",price:0},
      {name:"تخم‌مرغ و نان",description:"",price:0},
      {name:"پنکیک",description:"",price:0}
    ]
  },
  {
    id:"food",
    name:"غذا",
    caption:"FOOD",
    image:"https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=800&q=85",
    products:[
      {name:"پاستا",description:"",price:0},
      {name:"برگر",description:"",price:0},
      {name:"ساندویچ",description:"",price:0},
      {name:"سیب‌زمینی",description:"",price:0}
    ]
  },
  {
    id:"tea",
    name:"چای و دمنوش",
    caption:"TEA & HERBAL",
    image:"https://images.unsplash.com/photo-1544787219-7f47ccb76574?auto=format&fit=crop&w=800&q=85",
    products:[
      {name:"چای سیاه",description:"",price:0},
      {name:"چای سبز",description:"",price:0},
      {name:"دمنوش آرامش",description:"",price:0},
      {name:"چای ماسالا",description:"",price:0}
    ]
  }
];

const homeView = document.getElementById("homeView");
const categoryView = document.getElementById("categoryView");
const searchView = document.getElementById("searchView");
const categoryGrid = document.getElementById("categoryGrid");
const dynamicMenu = document.getElementById("dynamicMenu");
const searchResults = document.getElementById("searchResults");
const searchInput = document.getElementById("searchInput");
const resultNote = document.getElementById("resultNote");

let activeCategory = null;
let lastView = "home";

document.getElementById("cafeAddress").textContent = CAFE_ADDRESS;

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[char]));
}

function formatPrice(price){
  const value = Number(price) || 0;
  if(value <= 0) return "قیمت اعلام نشده";
  return value.toLocaleString("fa-IR") + " تومان";
}

function showView(view){
  [homeView,categoryView,searchView].forEach(section=>{
    section.classList.remove("active");
  });

  view.classList.add("active");
  window.scrollTo({top:0,behavior:"instant"});
}

function renderCategories(){
  categoryGrid.innerHTML = "";

  menuData.forEach((category,index)=>{
    const card = document.createElement("button");
    card.type = "button";
    card.className = "category-card";

    card.innerHTML = `
      <img src="${escapeHTML(category.image)}"
           alt="${escapeHTML(category.name)}"
           loading="lazy">
      <div class="cat-info">
        <div>
          <div class="cat-name">${escapeHTML(category.name)}</div>
          <div class="cat-caption">${escapeHTML(category.caption)}</div>
        </div>
        <span class="cat-arrow" aria-hidden="true">↙</span>
      </div>
    `;

    card.addEventListener("click",()=>openCategory(category.id));
    categoryGrid.appendChild(card);
  });
}

function renderCategoryProducts(category){
  dynamicMenu.innerHTML = "";

  const section = document.createElement("section");
  section.className = "menu-section active";

  const list = document.createElement("div");
  list.className = "item-list";

  if(!category.products.length){
    list.innerHTML = '<div class="empty">هنوز محصولی ثبت نشده است.</div>';
  }

  category.products.forEach(product=>{
    const item = document.createElement("article");
    item.className = "item-card";

    item.innerHTML = `
      <div>
        <div class="item-name">${escapeHTML(product.name)}</div>
        ${product.description
          ? `<div class="item-desc">${escapeHTML(product.description)}</div>`
          : ""}
      </div>
      <div class="item-price">${formatPrice(product.price)}</div>
    `;

    list.appendChild(item);
  });

  section.appendChild(list);
  dynamicMenu.appendChild(section);
}

function openCategory(id){
  const category = menuData.find(item=>item.id===id);
  if(!category) return;

  activeCategory = id;
  lastView = "category";
  searchInput.value = "";

  document.getElementById("pageCategoryName").textContent = category.name;
  document.getElementById("pageCategoryCaption").textContent =
    category.products.length
      ? category.products.length.toLocaleString("fa-IR")+" محصول در این دسته"
      : "محصولات این دسته";

  document.getElementById("pageCategoryNumber").textContent =
    String(menuData.indexOf(category)+1).padStart(2,"0");

  renderCategoryProducts(category);
  showView(categoryView);
}

function renderSearchResults(query){
  searchResults.innerHTML = "";
  const normalizedQuery = query.trim().toLocaleLowerCase("fa");
  const matches = [];

  menuData.forEach(category=>{
    category.products.forEach(product=>{
      const searchable = (
        category.name+" "+product.name+" "+(product.description||"")
      ).toLocaleLowerCase("fa");

      if(searchable.includes(normalizedQuery)){
        matches.push({category,product});
      }
    });
  });

  if(!matches.length){
    searchResults.innerHTML =
      '<div class="empty" style="grid-column:1/-1">موردی با این عبارت پیدا نشد.</div>';
  }else{
    matches.forEach(({category,product})=>{
      const item = document.createElement("article");
      item.className = "item-card";

      item.innerHTML = `
        <div>
          <div class="item-name">${escapeHTML(product.name)}</div>
          <div class="item-desc">${escapeHTML(category.name)}${
            product.description
              ? " · "+escapeHTML(product.description)
              : ""
          }</div>
        </div>
        <div class="item-price">${formatPrice(product.price)}</div>
      `;

      searchResults.appendChild(item);
    });
  }

  resultNote.textContent = matches.length
    ? matches.length.toLocaleString("fa-IR")+" مورد پیدا شد"
    : "نتیجه‌ای پیدا نشد";

  lastView = "search";
  showView(searchView);
}

searchInput.addEventListener("keydown",event=>{
  if(event.key==="Enter"){
    const query = searchInput.value.trim();
    if(query) renderSearchResults(query);
  }
});

searchInput.addEventListener("input",()=>{
  if(!searchInput.value.trim() && searchView.classList.contains("active")){
    showView(homeView);
  }
});

document.getElementById("backButton").addEventListener("click",()=>{
  searchInput.value = "";
  showView(homeView);
});

document.getElementById("searchBackButton").addEventListener("click",()=>{
  searchInput.value = "";
  showView(homeView);
});

document.getElementById("brandHome").addEventListener("click",event=>{
  event.preventDefault();
  searchInput.value = "";
  showView(homeView);
});

renderCategories();
showView(homeView);
</script>

</body>
</html>
