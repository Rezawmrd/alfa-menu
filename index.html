:root{
  --cream:#F4F0E8;
  --green:#343D32;
  --green-dark:#242C24;
  --orange:#C66B42;
  --text:#292B26;
  --muted:#89877D;
  --line:#DDD8CC;
  --white:#FFFEFA;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}

body{
  background:var(--cream);
  color:var(--text);
  font-family:"Vazirmatn",sans-serif;
  line-height:1.8;
  overflow-x:hidden;
}

body.intro-active{overflow:hidden}
a{color:inherit;text-decoration:none}
button,input{font:inherit}
button{cursor:pointer}

.container{
  width:min(1080px,calc(100% - 48px));
  margin:auto;
}

/* INTRO */

.intro{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--cream);
  opacity:1;
  visibility:visible;
  transition:opacity .7s ease,visibility .7s ease;
}

.intro-logo{
  width:min(260px,70vw);
  max-height:55vh;
  object-fit:contain;
  animation:introLogo 2.5s ease both;
}

@keyframes introLogo{
  0%{opacity:0;transform:scale(.9);filter:blur(5px)}
  30%{opacity:1;transform:scale(1);filter:blur(0)}
  75%,100%{opacity:1;transform:scale(1.025);filter:blur(0)}
}

.intro.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(244,240,232,.94);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(52,61,50,.12);
}

.header-inner{
  min-height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.brand{
  direction:ltr;
  font-family:"DM Sans",sans-serif;
  font-size:34px;
  font-weight:800;
  letter-spacing:-2.4px;
  color:var(--green);
  line-height:1;
}

.brand span{color:var(--orange)}

.header-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.header-actions a{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:38px;
  padding:7px 14px;
  border:1px solid rgba(52,61,50,.18);
  border-radius:2px;
  font-size:12px;
  font-weight:600;
  transition:background .25s,color .25s,border-color .25s;
}

.header-actions a:hover{
  background:var(--green);
  color:var(--white);
  border-color:var(--green);
}

main{min-height:55vh;padding-bottom:30px}

/* SEARCH */

.search-wrap{margin-top:28px}

.search{
  height:52px;
  display:flex;
  align-items:center;
  gap:13px;
  padding:0 17px;
  background:rgba(255,254,250,.72);
  border:1px solid var(--line);
  transition:border-color .25s,background .25s;
}

.search:focus-within{
  border-color:var(--green);
  background:var(--white);
}

.search svg{
  width:19px;
  height:19px;
  stroke:var(--green);
  fill:none;
  stroke-width:1.6;
  flex-shrink:0;
}

.search input{
  width:100%;
  height:100%;
  border:0;
  outline:0;
  background:transparent;
  font-size:13px;
  color:var(--text);
}

.search input::placeholder{color:#99958B}

/* HOME INTRO */

.home-intro{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  margin-top:45px;
  margin-bottom:25px;
  padding-bottom:23px;
  border-bottom:1px solid var(--line);
}

.home-intro-copy{min-width:0}

.eyebrow{
  display:flex;
  align-items:center;
  gap:9px;
  margin-bottom:8px;
  color:var(--orange);
  font-family:"DM Sans",sans-serif;
  font-size:10px;
  font-weight:800;
  letter-spacing:2.5px;
  direction:ltr;
}

.eyebrow::before{
  content:"";
  width:22px;
  height:2px;
  background:var(--orange);
}

.home-intro h1{
  color:var(--green);
  font-size:clamp(25px,4vw,38px);
  font-weight:900;
  line-height:1.55;
  letter-spacing:-.7px;
}

.home-intro p{
  margin-top:5px;
  color:var(--muted);
  font-size:12px;
}

.home-edition{
  direction:ltr;
  flex-shrink:0;
  color:rgba(52,61,50,.25);
  font-family:"DM Sans",sans-serif;
  font-size:12px;
  font-weight:800;
  letter-spacing:2px;
}

/* LUXURY CATEGORY CARDS */

.category-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
}

.category-card{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:stretch;
  justify-content:space-between;
  min-width:0;
  min-height:228px;
  padding:0;
  overflow:hidden;
  isolation:isolate;
  text-align:right;
  font-family:inherit;
  color:var(--green);
  background:#FBF9F4;
  border:1px solid #D9D4C8;
  border-radius:0;
  box-shadow:none;
  transition:background .25s ease,border-color .25s ease;
}

.category-card::before{
  content:"";
  position:absolute;
  top:0;
  right:0;
  left:0;
  height:4px;
  background:var(--green);
  transition:background .25s ease;
}

.category-card::after{content:none}

.category-card:hover{
  background:#FFFDF8;
  border-color:var(--green);
  transform:none;
  box-shadow:none;
}

.category-card:hover::before{background:var(--orange)}

.cat-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:22px 23px 0;
}

.cat-index{display:none}
.cat-mark{display:none}

.cat-info{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:10px;
  min-width:0;
  padding:25px 23px 24px;
}

.cat-info-copy{
  min-width:0;
  width:100%;
}

.cat-name{
  position:relative;
  display:block;
  color:var(--green);
  font-size:clamp(21px,2.5vw,29px);
  font-weight:800;
  line-height:1.7;
  letter-spacing:-.5px;
  overflow-wrap:anywhere;
  transition:color .25s ease;
}

.category-card:hover .cat-name{color:var(--green)}

.cat-caption{
  margin-top:7px;
  color:#858477;
  font-family:"DM Sans","Vazirmatn",sans-serif;
  font-size:11px;
  font-weight:400;
  line-height:1.9;
  overflow-wrap:anywhere;
}

.cat-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin:0 23px;
  padding:13px 0 17px;
  border-top:1px solid #E5E0D5;
}

.cat-discover{
  color:#65675C;
  font-size:11px;
  font-weight:600;
  transition:color .25s ease;
}

.category-card:hover .cat-discover{color:var(--orange)}

.cat-arrow{
  width:31px;
  height:31px;
  flex-shrink:0;
  display:grid;
  place-items:center;
  border:1px solid #D8D2C5;
  border-radius:0;
  color:var(--green);
  background:transparent;
  font-family:"DM Sans",sans-serif;
  font-size:17px;
  line-height:1;
  transition:background .25s ease,color .25s ease,border-color .25s ease;
}

.category-card:hover .cat-arrow{
  background:var(--green);
  color:#FFFDF8;
  border-color:var(--green);
  transform:none;
}

/* CATEGORY VIEW */

.view{display:none;animation:pageEnter .3s ease}
.view.active{display:block}

@keyframes pageEnter{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}

.back-button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  padding:8px 13px;
  margin:25px 0 23px;
  color:var(--green);
  background:transparent;
  border:1px solid var(--line);
  font-size:12px;
  font-weight:700;
  transition:background .2s,color .2s,border-color .2s;
}

.back-button:hover{
  color:white;
  background:var(--green);
  border-color:var(--green);
}

.back-arrow{font-size:17px}

.page-title{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:15px;
  border-bottom:1px solid var(--line);
  padding-bottom:18px;
  margin-bottom:17px;
}

.page-title h2{
  color:var(--green);
  font-size:clamp(22px,4vw,30px);
  font-weight:900;
  line-height:1.5;
}

.page-title p{margin-top:4px;color:var(--muted);font-size:11px}

.page-number{
  direction:ltr;
  flex-shrink:0;
  color:rgba(52,61,50,.2);
  font-family:"DM Sans",sans-serif;
  font-size:32px;
  font-weight:800;
  line-height:1;
}

.subcategory-heading{
  margin:22px 0 13px;
  color:var(--green);
  font-size:13px;
  font-weight:800;
}

/* SUBCATEGORIES */

.subcategory-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  margin-top:13px;
}

.subcategory-card{
  position:relative;
  width:100%;
  min-width:0;
  min-height:82px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:14px 15px;
  text-align:right;
  font-family:inherit;
  color:var(--green);
  background:var(--white);
  border:1px solid var(--line);
  border-radius:2px;
  transition:background .2s,border-color .2s,transform .2s;
}

.subcategory-card:hover{
  background:#fff;
  border-color:var(--orange);
  transform:translateY(-2px);
}

.subcategory-info{min-width:0}

.subcategory-name{
  font-size:13px;
  font-weight:800;
  line-height:1.8;
  overflow-wrap:anywhere;
}

.subcategory-caption{
  margin-top:3px;
  color:var(--muted);
  font-size:10px;
  line-height:1.8;
}

.subcategory-arrow{
  width:29px;
  height:29px;
  flex-shrink:0;
  display:grid;
  place-items:center;
  border:1px solid var(--line);
  border-radius:50%;
  color:var(--orange);
  font-family:"DM Sans",sans-serif;
  font-size:17px;
  transition:background .2s,color .2s,border-color .2s;
}

.subcategory-card:hover .subcategory-arrow{
  background:var(--green);
  color:white;
  border-color:var(--green);
}

/* PRODUCTS */

.item-list{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:0 28px;
}

.item-card{
  min-width:0;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:center;
  gap:8px 12px;
  padding:17px 0;
  border-bottom:1px solid var(--line);
  animation:pageEnter .3s ease both;
}

.item-name{color:var(--text);font-size:14px;font-weight:800;line-height:1.8}
.item-desc{margin-top:4px;color:var(--muted);font-size:11px;line-height:1.9}
.item-price{direction:rtl;white-space:nowrap;color:var(--green);font-size:12px;font-weight:800}

.empty{
  grid-column:1/-1;
  padding:25px 14px;
  text-align:center;
  color:var(--muted);
  background:rgba(255,254,250,.6);
  border:1px dashed var(--line);
  font-size:12px;
}

/* FOOTER */

.footer{margin-top:40px;padding:0 0 25px;background:var(--cream)}
.footer-inner{width:min(1080px,calc(100% - 48px));margin:auto}

.address-box{
  position:relative;
  display:flex;
  align-items:center;
  gap:15px;
  padding:20px;
  overflow:hidden;
  background:var(--green);
  color:var(--white);
}

.address-box::before{
  content:"ALFA";
  position:absolute;
  left:10px;
  bottom:-35px;
  color:rgba(255,255,255,.035);
  font-family:"DM Sans",sans-serif;
  font-size:100px;
  font-weight:800;
  line-height:1;
  direction:ltr;
  pointer-events:none;
}

.address-icon{
  position:relative;
  z-index:1;
  width:43px;
  height:43px;
  flex-shrink:0;
  display:grid;
  place-items:center;
  border:1px solid rgba(255,255,255,.25);
  color:#E3A17F;
}

.address-icon svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.5}
.address-content{position:relative;z-index:1;min-width:0}
.address-title{margin-bottom:3px;font-size:13px;font-weight:800}
.address-text{color:rgba(255,255,255,.73);font-size:11px;line-height:2;overflow-wrap:anywhere}

.address-note{
  display:inline-block;
  margin-top:7px;
  padding:2px 8px;
  color:#E3A17F;
  border:1px solid rgba(227,161,127,.35);
  font-size:9px;
}

.status-message{margin-top:13px;text-align:center;color:var(--muted);font-size:12px}
.status-message.error{color:#B74444}
.status-message button{margin-right:7px;padding:5px 12px;color:var(--green);background:transparent;border:1px solid var(--line)}

/* DESKTOP */

@media(min-width:800px){
  .category-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));

  .category-card{min-height:245px}
  .cat-top{padding:25px 25px 0}
  .cat-info{padding:30px 25px}
  .cat-name{font-size:25px}
  .cat-caption{font-size:11px}
  .cat-bottom{margin:0 25px;padding:15px 0 19px}
  .home-intro{margin-top:53px;margin-bottom:30px}
}

  .cat-caption{font-size:9px;margin-top:5px}

  .cat-bottom{
    margin:0 13px;

  .cat-discover{font-size:9px}
  .cat-arrow{width:27px;height:27px;font-size:15px}

  .subcategory-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

  .page-number{font-size:26px}

  .footer{margin-top:32px;padding-bottom:17px}
  .footer-inner{width:calc(100% - 30px)}
  .address-box{padding:15px 13px;gap:11px}
  .address-icon{width:37px;height:37px}
  .address-text{font-size:10px}
  .intro-logo{width:min(235px,72vw)}
}

@media(max-width:360px){
  .container{width:calc(100% - 24px)}
  .brand{font-size:26px}
  .header-actions a{padding:5px 8px;font-size:10px}
  .home-intro h1{font-size:24px}
  .home-edition{font-size:8px}
  .category-grid{gap:8px}
  .category-card{min-height:164px}
  .cat-top{padding:14px 10px 0}
  .cat-info{padding:19px 10px 17px}
  .cat-name{font-size:14px}
  .cat-caption{font-size:8px}
  .cat-bottom{margin:0 10px;padding:9px 0 10px}
  .cat-discover{font-size:8px}
  .cat-arrow{width:24px;height:24px}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    scroll-behavior:auto!important;
    animation:none!important;
    transition:none!important;
  }
}

const homeStatus = document.getElementById("homeStatus");

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g,char=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[char]));
}

function formatPrice(price){
  const value = Number(price) || 0;
  return value <= 0
    ? "قیمت اعلام نشده"
    : value.toLocaleString("fa-IR") + " تومان";
}

function showView(view){
  [homeView,categoryView,searchView].forEach(section=>section.classList.remove("active"));
  view.classList.add("active");
  window.scrollTo({top:0,behavior:"auto"});
}

function getCategory(id){
  return menuData.find(category=>String(category.id)===String(id));
}

function getChildren(parentId){
  return menuData.filter(category=>String(category.parent_id || "")===String(parentId));
}

function getRoot(category){
  if(!category) return null;
  if(!category.parent_id) return category;
  return getCategory(category.parent_id) || category;
}

function getCategoryPath(category){
  const root=getRoot(category);
  return root && String(root.id)!==String(category.id)
    ? root.name+" / "+category.name
    : category?.name || "";
}

async function loadMenu(){
  homeStatus.textContent="در حال دریافت منو...";
  homeStatus.classList.remove("error");

  try{
    const [categoryResult,productResult,settingsResult]=await Promise.all([
      db.from("alfa_categories")
        .select("id,name,caption,image_url,sort_order,active,parent_id")
        .eq("active",true)
        .order("sort_order"),

      db.from("alfa_products")
        .select("id,category_id,name,description,price,sort_order,active")
        .eq("active",true)
        .order("sort_order"),

      db.from("alfa_settings")
        .select("phone,instagram,address")
        .eq("id",1)
        .maybeSingle()
    ]);

    if(categoryResult.error) throw categoryResult.error;
    if(productResult.error) throw productResult.error;
    if(settingsResult.error) throw settingsResult.error;

    const categories=categoryResult.data || [];
    const products=productResult.data || [];
    cafeSettings=settingsResult.data || cafeSettings;

    menuData=categories.map(category=>({
      id:category.id,
      name:category.name,
      caption:category.caption || "",
      image:category.image_url || "",
      sort_order:category.sort_order || 0,
      parent_id:category.parent_id || null,
      products:products
        .filter(product=>String(product.category_id)===String(category.id))
        .map(product=>({
          id:product.id,
          name:product.name,
          description:product.description || "",
          price:product.price || 0,
          sort_order:product.sort_order || 0
        }))
    }));

    renderCategories();
    applySettings();

    homeStatus.textContent=menuData.some(category=>!category.parent_id)
      ? ""
      : "هنوز دسته‌بندی فعالی در منو ثبت نشده است.";

  }catch(error){
    console.error("ALFA menu error:",error);
    homeStatus.textContent="دریافت منو ناموفق بود. اتصال اینترنت و دسترسی دیتابیس را بررسی کنید.";
    homeStatus.classList.add("error");
    homeStatus.innerHTML+=' <button type="button" id="retryLoad">تلاش دوباره</button>';
    document.getElementById("retryLoad").addEventListener("click",loadMenu);
  }
}

function applySettings(){
  document.getElementById("cafeAddress").textContent=
    cafeSettings.address || "آدرس کافه هنوز ثبت نشده است.";

  const phoneLink=document.getElementById("phoneLink");

  if(cafeSettings.phone){
    phoneLink.href="tel:"+cafeSettings.phone.replace(/[^\d+]/g,"");
  }

  const instagramLink=document.getElementById("instagramLink");

  if(cafeSettings.instagram){
    let value=cafeSettings.instagram.trim();

    if(/^https?:\/\//i.test(value)){
      instagramLink.href=value;
    }else{
      instagramLink.href="https://instagram.com/"+encodeURIComponent(value.replace(/^@/,""));
    }
  }
}

/* دسته‌بندی‌های اصلی */

function makeCategoryCard(category,index){
  const card=document.createElement("button");
  card.type="button";
  card.className="category-card";

  const childCount=getChildren(category.id).length;

  const caption=category.caption || (
    childCount
      ? childCount.toLocaleString("fa-IR")+" زیر‌دسته"
      : category.products.length.toLocaleString("fa-IR")+" محصول"
  );

  card.innerHTML=`
    <div class="cat-top"></div>

    <div class="cat-info">
      <div class="cat-info-copy">
        <div class="cat-name">${escapeHTML(category.name)}</div>
        <div class="cat-caption">${escapeHTML(caption)}</div>
      </div>
    </div>

    <div class="cat-bottom">
      <span class="cat-discover">مشاهده منو</span>
      <span class="cat-arrow" aria-hidden="true">↙</span>
    </div>
  `;

  card.addEventListener("click",()=>openCategory(category.id));
  return card;
}

/* نمایش دسته‌های اصلی */

function renderCategories(){
  categoryGrid.innerHTML="";

  const roots=menuData
    .filter(category=>!category.parent_id)
    .sort((a,b)=>a.sort_order-b.sort_order);

  roots.forEach((category,index)=>{
    categoryGrid.appendChild(makeCategoryCard(category,index));
  });
}

function createProductCard(product,categoryName=""){
  const item=document.createElement("article");
  item.className="item-card";

  const description=[categoryName,product.description].filter(Boolean).join(" · ");

  item.innerHTML=`
    <div>
      <div class="item-name">${escapeHTML(product.name)}</div>
      ${description?`<div class="item-desc">${escapeHTML(description)}</div>`:""}
    </div>
    <div class="item-price">${formatPrice(product.price)}</div>
  `;

  return item;
}

function renderProducts(container,products,categoryName=""){
  const list=document.createElement("div");
  list.className="item-list";

  if(!products.length){
    list.innerHTML='<div class="empty">هنوز محصولی در این دسته ثبت نشده است.</div>';
  }else{
    products.forEach(product=>{
      list.appendChild(createProductCard(product,categoryName));
    });
  }

  container.appendChild(list);
}

/* ورود به دسته یا زیر‌دسته */

function openCategory(id){
  const category=getCategory(id);
  if(!category) return;

  currentCategoryId=category.id;
  searchInput.value="";
  dynamicMenu.innerHTML="";

  document.getElementById("pageCategoryName").textContent=category.name;

  const root=getRoot(category);

  const rootIndex=menuData
    .filter(item=>!item.parent_id)
    .findIndex(item=>String(item.id)===String(root?.id));

  document.getElementById("pageCategoryNumber").textContent=
    String(Math.max(0,rootIndex+1)).padStart(2,"0");

  const children=getChildren(category.id);
  const hasChildren=children.length>0;

  document.getElementById("pageCategoryCaption").textContent=
    hasChildren
      ? "زیر‌دستهٔ مورد نظرت رو انتخاب کن."
      : category.products.length.toLocaleString("fa-IR")+" محصول در این دسته";

  document.getElementById("backButtonText").textContent=
    category.parent_id
      ? "بازگشت به "+(root?.name || "دسته اصلی")
      : "بازگشت به دسته‌بندی‌ها";

  if(hasChildren){
    const heading=document.createElement("div");
    heading.className="subcategory-heading";
    heading.textContent="انتخاب زیر‌دسته";
    dynamicMenu.appendChild(heading);

    const grid=document.createElement("div");
    grid.className="subcategory-grid";

    children
      .sort((a,b)=>a.sort_order-b.sort_order)
      .forEach(child=>{
        const childCard=document.createElement("button");
        childCard.type="button";
        childCard.className="subcategory-card";

        const childCount=child.products.length;
        const childCaption=child.caption || childCount.toLocaleString("fa-IR")+" محصول";

        childCard.innerHTML=`
          <div class="subcategory-info">
            <div class="subcategory-name">${escapeHTML(child.name)}</div>
            <div class="subcategory-caption">${escapeHTML(childCaption)}</div>
          </div>
          <span class="subcategory-arrow" aria-hidden="true">↙</span>
        `;

        childCard.addEventListener("click",()=>openCategory(child.id));
        grid.appendChild(childCard);
      });

    dynamicMenu.appendChild(grid);

    if(category.products.length){
      const directHeading=document.createElement("div");
      directHeading.className="subcategory-heading";
      directHeading.textContent="سایر محصولات "+category.name;
      dynamicMenu.appendChild(directHeading);
      renderProducts(dynamicMenu,category.products);
    }
  }else{
    renderProducts(dynamicMenu,category.products);
  }

  showView(categoryView);
}

/* بازگشت */

function goBack(){
  const category=getCategory(currentCategoryId);

  if(category && category.parent_id){
    openCategory(category.parent_id);
  }else{
    currentCategoryId=null;
    goHome();
  }
}

/* جست‌وجوی محصولات */

function renderSearchResults(query){
  searchResults.innerHTML="";

  const q=query.trim().toLocaleLowerCase("fa");
  const matches=[];

  menuData.forEach(category=>{
    category.products.forEach(product=>{
      const searchable=[
        category.name,
        getCategoryPath(category),
        product.name,
        product.description || ""
      ].join(" ").toLocaleLowerCase("fa");

      if(searchable.includes(q)){
        matches.push({category,product});
      }
    });
  });

  if(!matches.length){
    searchResults.innerHTML='<div class="empty">موردی با این عبارت پیدا نشد.</div>';
  }else{
    matches.forEach(({category,product})=>{
      searchResults.appendChild(
        createProductCard(product,getCategoryPath(category))
      );
    });
  }

  resultNote.textContent=matches.length
    ? matches.length.toLocaleString("fa-IR")+" مورد پیدا شد"
    : "نتیجه‌ای پیدا نشد";

  showView(searchView);
}

function goHome(){
  currentCategoryId=null;
  searchInput.value="";
  showView(homeView);
}

/* جست‌وجو با Enter */

searchInput.addEventListener("keydown",event=>{
  if(event.key==="Enter"){
    const query=searchInput.value.trim();

    if(query){
      renderSearchResults(query);
      searchInput.blur();
    }
  }
});

searchInput.addEventListener("input",()=>{
  if(!searchInput.value.trim() && searchView.classList.contains("active")){
    showView(homeView);
  }
});

document.getElementById("backButton").addEventListener("click",goBack);
document.getElementById("searchBackButton").addEventListener("click",goHome);

document.getElementById("brandHome").addEventListener("click",event=>{
  event.preventDefault();
  goHome();
});

loadMenu();
</script></body>
</html>
